[package]
name = "sherlock-reviews"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
sherlock-domain = { path = "../sherlock-domain" }
serde_json = "1"
sha2 = "0.10"
directories = "6"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
hmac = "0.12"
fs2 = "0.4"
getrandom = "0.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
chacha20poly1305 = "0.10"
